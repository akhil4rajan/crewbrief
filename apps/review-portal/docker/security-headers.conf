# Included in every location (nginx does not inherit add_header into blocks that set their own).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Content-Security-Policy depends on the configured API/gateway origins; generated at start-up.
include /usr/share/nginx/runtime/csp.conf;
