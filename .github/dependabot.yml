# Version-update PRs are paused: open-pull-requests-limit 0 stops Dependabot opening them.
# To resume, raise the limit (e.g. 5) for the ecosystems you want updated.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 0
    groups:
      python-minor:
        update-types: [minor, patch]
      azure-sdk:
        patterns: ["azure-*", "openai"]

  - package-ecosystem: npm
    directory: /apps/review-portal
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 0
    groups:
      portal-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /apps/review-portal]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 0
