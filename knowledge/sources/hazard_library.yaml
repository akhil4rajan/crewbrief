# CrewBrief hazard & control library — electricity distribution field work (Australia).
#
# Codes are stable identifiers used in forms, patches, audit and eval. Never reuse or rename a code;
# retire it instead. Keywords are lowercase phrases crews actually say on site. They drive the local
# phrase matcher and the search index, so prefer specific multi-word phrases over single generic words.
# The first keyword of a control is used as its short spoken label ("no isolation or earthing control").
#
# Validate and index with:  python -m knowledge.ingest --source ./knowledge/sources --index hazards
version: "2026.10"

hazards:
  # --- Electrical -----------------------------------------------------------------------------
  - code: HZ-ELEC-LV
    name: Contact with live LV conductors
    category: electrical
    severity: critical
    description: Electric shock or burns from energised low-voltage (230/400 V) mains, service cables, pillars or switchboards.
    keywords: [live lv, low voltage, lv mains, lv conductors, lv network, lv cable, lv cables, live mains, live lv mains, lv service, service mains, live service, energised, still live, it's live, lines are live, live parts, live work, live low voltage, "415 volts", "240 volts", "230 volts", "415", lv, the lv, lv board, lv fuses, lv compartment, lv underbuilt, stays live, still alive, treat it as live, treat everything as live, wires down, lines down, conductors are down, conductors are on the road, faulted cable]
    typical_controls: [CT-ISO-LOTO, CT-ISO-FUSES, CT-ENG-EARTH, CT-ENG-TEST-DEAD, CT-ENG-INSUL-COVERS, CT-PPE-ARC, CT-PPE-INSUL-GLOVES, CT-ADM-ACCESS-PERMIT]
    references: [DOC-ESR-001]

  - code: HZ-ELEC-HV
