controls:
  # --- Elimination / substitution ----------------------------------------------------------------
  - code: CT-ELIM-STOP-WORK
    name: Stop or postpone the work
    type: elimination
    description: Do not start, or stop and make safe, when conditions exceed limits (lightning, wind, catastrophic fire danger).
    keywords: [stop work, postpone, call it off, pull the pin, stand down, wait it out, stop the job, come down off the pole, come down if]

  - code: CT-ELIM-NO-DISTURB
    name: Do not disturb asbestos (work around it)
    type: elimination
    description: Plan the task so suspected asbestos material is not drilled, cut, broken or removed.
    keywords: [don't disturb, do not disturb, won't disturb, work around it, leave the board, no drilling, won't drill, no cutting]

  - code: CT-SUB-EWP
    name: Use an EWP instead of climbing
    type: substitution
    description: Work from an elevated work platform rather than climbing the pole.
    keywords: [ewp instead of climbing, use the ewp instead, work from the bucket, from the bucket, bucket instead, not climbing, nobody climbs]

  - code: CT-SUB-BATTERY-TOOLS
    name: Battery tools instead of leads
    type: substitution
    description: Use cordless tools to remove leads and generator supplies from the work area.
    keywords: [battery tools, cordless tools, battery powered]

  # --- Isolation ---------------------------------------------------------------------------------
  - code: CT-ISO-LOTO
    name: Isolate, lock out and tag out
    type: isolation
    description: Isolate the supply at a defined point, apply personal locks and danger tags, and keep them on until work is complete.
    keywords: [isolation, isolate, isolated, isolating, lock out, locked out, lock it out, tag out, tagged out, loto, danger tag, danger tags, personal danger tag, lock and tag, de energise, de energised, deenergise, make it dead, made dead, kill the power, switch it off]

  - code: CT-ISO-FUSES
    name: Remove service fuses / open the service
    type: isolation
    description: Remove the service fuses or open the links at the pole or pillar so the service is disconnected from the network.
    keywords: [pull the fuses, pull the fuse, remove the fuses, remove the fuse, service fuse, service fuses, fuses out, fuse out, pull the service, open the links, links out, disconnect at the pole, disconnect at the pillar]

  - code: CT-ISO-HV-SWITCHING
    name: HV switching program and isolation
    type: isolation
    description: Isolate HV plant to an approved switching program, with points of isolation locked and tagged by the switching operator.
    keywords: [switching program, switching programme, switching instruction, switching sheet, switching schedule, hv isolation, isolate the hv, hv isolated, feeder isolated, open the abs, abs open, open the air break, open the switch, drop the ddos, dropped the ddos]

  - code: CT-ISO-SOLAR
    name: Isolate solar, batteries and generators at the switchboard
    type: isolation
    description: Isolate and tag inverter AC/DC isolators, home batteries and standby generators before treating the service as dead.
    keywords: [isolate the solar, solar isolated, solar isolator, solar off, inverter isolated, isolate the inverter, turn off the inverter, inverter off, pv isolator, ac isolator, dc isolator, isolate the generator, generator off, battery isolated, isolate the battery]

  - code: CT-ISO-BARRIERS
    name: Physical barriers and barricading
    type: isolation
    description: Rigid barriers, fencing, pit guards or plates that physically separate people from the hazard.
    keywords: [barriers, barricade, barricades, barricading, hard barriers, mesh fencing, temporary fencing, pit guard, pit guards, trench covers, plate the trench, steel plates, cover the hole, cover the pit]

