[project]
name = "crewbrief"
version = "0.1.0"
description = "Real-time voice AI that drafts utility crew hazard assessments (JSA / SWMS) from pre-job briefings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pyjwt[crypto]>=2.9",
  "websockets>=13",
  "aiosqlite>=0.20",
  "jsonpatch>=1.33",
  "python-multipart>=0.0.9",  # recording upload (multipart/form-data)
]

[project.optional-dependencies]
# Real Azure integrations. Imported lazily, so local mode works without them.
azure = [
  "azure-identity>=1.17",
  "azure-cognitiveservices-speech>=1.40",
  "openai>=1.50",
  "azure-search-documents>=11.5",
  "azure-cosmos>=4.7",
  "azure-messaging-webpubsubservice>=1.2",
  "azure-ai-textanalytics>=5.3",
  "azure-monitor-opentelemetry>=1.6",
]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "services", "knowledge", "eval"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps", "infra", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101", "S104", "S105", "B008"]

[tool.ruff.lint.per-file-ignores]
"eval/**" = ["S"]
"**/tools/**" = ["S"]
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
